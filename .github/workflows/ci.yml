name: CI

on:
  # No tags and no `feature` here (#756). Both existed to drive the `docker`
  # matrix that used to live in this file; that job moved to build-images.yml,
  # which owns the release-tag trigger now. What is left is the quality gate:
  # PRs into all three branches, plus the post-merge state of develop and main.
  # `main` stays because the org's SonarCloud plan analyses the main branch only.
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
      - feature
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Job-level (not step-level) so the SonarCloud step's `if:` can read it —
    # the `secrets` context is unavailable in a step conditional, and a step's
    # own `env:` block is not in scope for its own `if:`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache turbo outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm -w lint

      - name: Type-check
        run: pnpm -w typecheck

      - name: Test
        run: pnpm -w test

      - name: Generate coverage reports (for SonarCloud)
        run: pnpm -w test:coverage
        continue-on-error: true

      - name: Build
        run: pnpm -w build

      - name: OpenAPI spec drift check
        run: |
          pnpm --filter @aggregator-dpg/api spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm --filter @aggregator-dpg/api spec:dump' and commit"; exit 1; }

      - name: Dep-cruiser — check interface boundaries
        run: pnpm dep-check

      # Two independent guards, for two different failure modes:
      #   `if:`               — no token at all. GitHub withholds repo secrets from
      #                         Dependabot-raised (and fork) pull_request runs, so an
      #                         ungated scan exits 3 with "Not authorized or project
      #                         not found" on every dependency PR. Skip, don't run.
      #   `continue-on-error` — token present but the scan fails (SonarCloud outage,
      #                         expired token, quality gate). `CI` is the required
      #                         check, so a scan that fails for reasons unrelated to
      #                         the code must not redden it; problems surface in the
      #                         run log and SonarCloud's own commit check instead.
      # SONAR_TOKEN comes from the job-level `env` above — a step's own `env:` block
      # is not in scope for its own `if:`.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true
