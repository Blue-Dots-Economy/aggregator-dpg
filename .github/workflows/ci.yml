name: CI

on:
  # No tags and no `feature` here (#756). Both existed to drive the `docker`
  # matrix that used to live in this file; that job moved to build-images.yml,
  # which owns the release-tag trigger now. What is left is the quality gate:
  # PRs into all three branches, plus the post-merge state of develop and main.
  # `main` stays because the org's SonarCloud plan analyses the main branch only.
  push:
    branches:
      - main
      - develop
      # release/**: hotfix tags are CI-gated on the release branch commit, and hotfix PRs target it.
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - feature
      # release/**: hotfix tags are CI-gated on the release branch commit, and hotfix PRs target it.
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: every job here only reads the repo. Jobs needing
# more declare it themselves (zizmor excessive-permissions,
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # ── Quality gate ───────────────────────────────────────────────────────────
  # Lint, type-check, build and tests run as parallel jobs. The `CI` job at the
  # end waits for all of them and is the one check branch protection requires
  # (docs/ci-required-checks.md). SonarCloud runs after the tests and does not
  # hold up `CI`.
  lint:
    permissions:
      contents: read
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm -w lint

      - name: Root script tests (stack helpers, ESLint config, workspace lint coverage)
        run: pnpm -w test:scripts

      - name: Dep-cruiser — check interface boundaries
        run: pnpm dep-check

  typecheck:
    permissions:
      contents: read
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Type-check
        run: pnpm -w typecheck

  build:
    permissions:
      contents: read
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm -w build

      - name: OpenAPI spec drift check
        run: |
          pnpm --filter @aggregator-dpg/api spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm --filter @aggregator-dpg/api spec:dump' and commit"; exit 1; }

      # The edge policy decides each request from this table
      # (docs/rbac/rbac-edge-enforcement.md §3.1); a route whose declaration
      # changed without regenerating it would be decided on stale data.
      - name: RBAC route table drift check
        run: |
          pnpm --filter @aggregator-dpg/api routes:dump
          git diff --exit-code policy/rbac/edge/routes.json || {
            echo "::error::policy/rbac/edge/routes.json is stale — run 'pnpm --filter @aggregator-dpg/api routes:dump' and commit"; exit 1; }

      # RBAC policy (policy/rbac): compile in strict mode, then run the Rego
      # tests, including the shared vectors that packages/rbac also runs
      # against its TypeScript mirror. Same image as the compose `opa` service.
      - name: RBAC policy — opa check + opa test
        run: |
          OPA=openpolicyagent/opa:1.21.1@sha256:d3a9a6bd4fbcb0f4403294b0d0b239b07be163ac118a46df7d50045b52e52053
          docker run --rm -v "$PWD/policy:/policy:ro" "$OPA" check --strict /policy/rbac
          docker run --rm -v "$PWD/policy:/policy:ro" "$OPA" test -v /policy/rbac

  # Unit tests with coverage, in three groups that run at the same time: the
  # API, the web app (in two shards, below) and every other workspace. Each
  # group's own vitest coverage thresholds fail the job.
  test:
    permissions:
      contents: read
    name: test / ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            filter: --filter=@aggregator-dpg/api
            coverage: apps/api/coverage/lcov.info
          - group: packages
            filter: --filter=!@aggregator-dpg/api --filter=!@aggregator-dpg/web
            coverage: |
              apps/*/coverage/lcov.info
              packages/*/coverage/lcov.info
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Test with coverage
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          read -ra filters <<< "$FILTER"
          pnpm -w turbo run test:coverage --continue "${filters[@]}"

      # Kept when the tests fail, so SonarCloud still gets a report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.group }}
          path: ${{ matrix.coverage }}
          if-no-files-found: warn
          retention-days: 1

  # The web suite is the largest, so it runs in two shards. Each shard writes a
  # vitest blob report with coverage; thresholds are off here because a shard
  # covers only part of the code. `test-web-merge` checks them on the whole.
  test-web:
    permissions:
      contents: read
    name: test / web ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - name: Build the packages the web app uses
        run: pnpm -w turbo run build --filter=@aggregator-dpg/web^...

      - name: Test shard ${{ matrix.shard }}/2 with coverage
        working-directory: apps/web
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          pnpm exec vitest run --shard="$SHARD/2" --reporter=blob --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: web-blob-${{ matrix.shard }}
          path: apps/web/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Merges the two web shards into one result and one coverage report, and
  # applies the web coverage thresholds to the whole suite.
  test-web-merge:
    permissions:
      contents: read
    name: test / web
    needs: test-web
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: web-blob-*
          path: apps/web/.vitest-reports
          merge-multiple: true

      - name: Merge shards and check coverage thresholds
        working-directory: apps/web
        run: pnpm exec vitest run --merge-reports --coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 1

  # Advisory, as before: not part of `CI`. Two guards, for two failure modes:
  #   `if:` on the scan    — no token at all. GitHub withholds repo secrets from
  #                          Dependabot-raised and fork pull_request runs; an
  #                          ungated scan exits 3 on every dependency PR.
  #   `continue-on-error`  — token present but the scan fails (outage, expired
  #                          token, quality gate). Problems show in the run log
  #                          and in SonarCloud's own commit check.
  sonar:
    permissions:
      contents: read
    name: sonar
    needs: [test, test-web-merge]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Job-level so the scan step's `if:` can read it: the `secrets` context is
    # not available in a step conditional.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so SonarCloud can attribute new code to its commits.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace

      # Each artifact keeps paths relative to the folder its files share, so
      # each one is restored to that folder.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-api
          path: apps/api/coverage
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-web
          path: apps/web/coverage
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-packages
          path: .
        continue-on-error: true

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        continue-on-error: true

  # The required check. Passes only when every quality-gate job succeeded; a
  # failed, cancelled or skipped job fails it.
  ci:
    permissions: {}
    name: CI
    needs: [lint, typecheck, build, test, test-web-merge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the quality-gate jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # ── Real-Postgres integration tests ────────────────────────────────────────
  # `*.integration.test.ts` skip themselves unless INTEGRATION_DATABASE_URL is
  # set, so `pnpm -w test` never touches a database. This job provides one: a
  # throwaway postgres:16 service, migrated from scratch (the fresh-instance
  # path), then the integration suites — including the contact migration's
  # idempotent re-run, advisory-lock concurrency, golden vectors and the
  # legacy-write sync triggers (apps/api/src/db/__tests__/contact.integration.test.ts).
  # A separate job (not a step in `ci`) so it reports as its own check; see
  # docs/ci-required-checks.md for whether it is required.
  db-integration:
    permissions:
      contents: read
    name: db-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aggregator
          POSTGRES_DB: aggregator_it
          # Throwaway database reachable only from this runner: trust auth, so
          # no credential appears anywhere in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aggregator -d aggregator_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only database (trust auth, see the service above).
      DATABASE_URL: postgres://aggregator@127.0.0.1:5432/aggregator_it
      INTEGRATION_DATABASE_URL: postgres://aggregator@127.0.0.1:5432/aggregator_it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: pnpm -w turbo run build --filter='./packages/*'

      - name: Migrate a fresh database
        run: pnpm --filter @aggregator-dpg/api db:migrate

      - name: Integration tests
        run: pnpm --filter @aggregator-dpg/api exec vitest run integration --no-file-parallelism

  # ── PR-path image smoke build (#756) ───────────────────────────────────────
  # Restores the review-time Dockerfile check that the `docker` matrix used to
  # provide before it moved to build-images.yml. That matrix ran on PRs with
  # `push: false`; this does the same thing and nothing more.
  #
  # BUILD ONLY — it does not boot the images. server.ts awaits runMigrations(),
  # getNetworkConfig() and loadEmailMessageOverrides() at startup, so a boot
  # probe would need Postgres, Redis and config fixtures, and would go red for a
  # missing service rather than a real defect. signals-search's smoke-image does
  # boot-and-probe because its /health handler needs no backing services; ours
  # would need that groundwork first.
  #
  # Without this, a broken Dockerfile first surfaces when a release tag is cut.
  smoke-image:
    permissions:
      contents: read
    name: smoke-image / ${{ matrix.app }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]
    # Job-level so the step `if:`s below can read it — the `secrets` context is
    # not available in a step conditional, and a step's own `env:` is not in
    # scope for its own `if:` (same reason the SonarCloud step above does this).
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # persist-credentials: false — this job only builds an image; it never
      # talks to git again (zizmor: artipacked / credential persistence).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The DHI bases live on dhi.io, which refuses anonymous pulls, so the build
      # cannot reach the first FROM without this. GitHub withholds repo secrets
      # from fork and Dependabot-raised pull_request runs, which is why every
      # step is gated on the token being present rather than failing: an ungated
      # build would turn every dependency-bump PR red for a missing credential
      # rather than a real defect.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.DOCKERHUB_TOKEN != ''
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.app }} image (no push)
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: false
          tags: aggregator-${{ matrix.app }}:pr
          # Shares the gha cache scope with build-images.yml, so this is usually
          # a warm build rather than a second cold one.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Explain the skip
        if: env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::warning::smoke-image skipped for ${APP}: no dhi.io credential on \
          this run (fork or Dependabot PR). The image build is still covered on \
          the release-tag path in build-images.yml."
        env:
          APP: ${{ matrix.app }}
