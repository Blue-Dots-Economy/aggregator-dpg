name: CI

on:
  push:
    branches:
      - main
      - develop
      # Validate the merged state of the integration branch too — PRs into
      # feature already run CI, but the post-merge result was unchecked.
      - feature

    tags:
      - 'web-v*.*.*'
      - 'api-v*.*.*'
      - 'worker-v*.*.*'
  pull_request:
    branches:
      - main
      - develop
      - feature
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Job-level (not step-level) so the SonarCloud step's `if:` can read it —
    # the `secrets` context is unavailable in a step conditional, and a step's
    # own `env:` block is not in scope for its own `if:`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache turbo outputs
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -w lint

      - name: Type-check
        run: pnpm -w typecheck

      - name: Test
        run: pnpm -w test

      - name: Generate coverage reports (for SonarCloud)
        run: pnpm -w test:coverage
        continue-on-error: true

      - name: Build
        run: pnpm -w build

      - name: OpenAPI spec drift check
        run: |
          pnpm --filter @aggregator-dpg/api spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm --filter @aggregator-dpg/api spec:dump' and commit"; exit 1; }

      - name: Dep-cruiser — check interface boundaries
        run: pnpm dep-check

      # Two independent guards, for two different failure modes:
      #   `if:`               — no token at all. GitHub withholds repo secrets from
      #                         Dependabot-raised (and fork) pull_request runs, so an
      #                         ungated scan exits 3 with "Not authorized or project
      #                         not found" on every dependency PR. Skip, don't run.
      #   `continue-on-error` — token present but the scan fails (SonarCloud outage,
      #                         expired token, quality gate). The docker/GHCR matrix
      #                         depends on this job, so that must not stop a green
      #                         build from publishing images; problems surface in the
      #                         run log and SonarCloud's own commit check instead.
      # SONAR_TOKEN comes from the job-level `env` above — a step's own `env:` block
      # is not in scope for its own `if:`.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true

  docker:
    name: Docker / ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning

    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=semver,pattern={{version}},match=${{ matrix.app }}-v(.*),group=1
            type=semver,pattern={{major}}.{{minor}},match=${{ matrix.app }}-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=aggregator-dpg-${{ matrix.app }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed ${REGISTRY}/${REPO}/${APP}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"
        env:
          REPO: ${{ github.repository }}
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # Scans the OS + system packages baked into the shipped artifact, which the
      # source/lockfile scan in security.yml structurally cannot see (an outdated
      # base-image library appears in no package.json). This repo carries the
      # largest dependency backlog of the six (76 open Dependabot alerts), so the
      # image surface is worth measuring rather than assuming.
      #
      # `github.repository` preserves the org's capitalisation
      # ("Blue-Dots-Economy"), which docker/metadata-action normalises for its own
      # tag outputs. A ref assembled by hand must be normalised too — an uppercase
      # path is an invalid image reference and Trivy would reject it.
      - name: Resolve scanned image ref
        id: scanref
        if: steps.build.outputs.digest != ''
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # Scanned by digest, not by tag: buildx pushes straight to the registry
      # without loading into the local docker image store, so the action's
      # `imageid` output is not resolvable by Trivy. The digest guard also means
      # the PR path — which builds WITHOUT pushing, so no digest exists and
      # nothing is in any registry to pull — skips cleanly instead of failing.
      - name: Trivy image scan
        if: steps.scanref.outputs.ref != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: always() && steps.scanref.outputs.ref != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          # One category per app so api/web/worker don't overwrite each other.
          category: trivy-image-${{ matrix.app }}

      # TODO: add smoke test `docker run --rm -p 3000:3000 <image> /health`
      #       once apps/api has a real HTTP server with a /health endpoint.
