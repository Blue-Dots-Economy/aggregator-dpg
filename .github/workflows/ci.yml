name: CI

on:
  push:
    branches:
      - main
      - develop
      # Validate the merged state of the integration branch too — PRs into
      # feature already run CI, but the post-merge result was unchecked.
      - feature

    tags:
      # Org-wide release tags — one tag builds all three apps. Both schemes:
      #   v*.*.*      semver releases   e.g. v1.2.0
      #   20*-s*-rc*  sprint release    e.g. 202608-s1-rc1
      #               <YYYYMM>-s<sprint>-rc<candidate>. A fix for an issue found
      #               in -rc1 ships as -rc2, so every candidate is its own image.
      #               Supersedes the dated GA-<date> scheme, no longer built here.
      - 'v*.*.*'
      - '20*-s*-rc*'
      # Per-app tags, retained: these release ONE app independently, and the
      # type=semver entries below extract the version from the app prefix.
      - 'web-v*.*.*'
      - 'api-v*.*.*'
      - 'worker-v*.*.*'
  pull_request:
    branches:
      - main
      - develop
      - feature
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Job-level (not step-level) so the SonarCloud step's `if:` can read it —
    # the `secrets` context is unavailable in a step conditional, and a step's
    # own `env:` block is not in scope for its own `if:`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Cache turbo outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm -w lint

      - name: Type-check
        run: pnpm -w typecheck

      - name: Test
        run: pnpm -w test

      - name: Generate coverage reports (for SonarCloud)
        run: pnpm -w test:coverage
        continue-on-error: true

      - name: Build
        run: pnpm -w build

      - name: OpenAPI spec drift check
        run: |
          pnpm --filter @aggregator-dpg/api spec:dump
          git diff --exit-code openapi.json || {
            echo "::error::openapi.json is stale — run 'pnpm --filter @aggregator-dpg/api spec:dump' and commit"; exit 1; }

      - name: Dep-cruiser — check interface boundaries
        run: pnpm dep-check

      # Two independent guards, for two different failure modes:
      #   `if:`               — no token at all. GitHub withholds repo secrets from
      #                         Dependabot-raised (and fork) pull_request runs, so an
      #                         ungated scan exits 3 with "Not authorized or project
      #                         not found" on every dependency PR. Skip, don't run.
      #   `continue-on-error` — token present but the scan fails (SonarCloud outage,
      #                         expired token, quality gate). The docker/GHCR matrix
      #                         depends on this job, so that must not stop a green
      #                         build from publishing images; problems surface in the
      #                         run log and SonarCloud's own commit check instead.
      # SONAR_TOKEN comes from the job-level `env` above — a step's own `env:` block
      # is not in scope for its own `if:`.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        continue-on-error: true

  docker:
    name: Docker / ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write   # Trivy image scan uploads SARIF to code-scanning

    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          # `type=ref,event=tag` emits the tag VERBATIM so the image tag equals the
          # release tag (v1.2.0 -> v1.2.0, 202608-s1-rc1 -> 202608-s1-rc1).
          # type=semver below is not sufficient: it strips the leading `v`, and it
          # cannot parse a 20*-s*-rc* tag at all (emits nothing, logs a warning).
          #
          # `enable=` excludes the PER-APP tags. Without that guard an
          # `api-v1.2.0` tag would stamp `api-v1.2.0` onto the web and worker
          # images too — this matrix builds all three on any matching tag, while
          # the type=semver `match=` below correctly resolves for only one of them.
          # Expressed as a deny-list of the per-app prefixes rather than an
          # allow-list of org-wide ones: an allow-list silently disables this
          # entry whenever the org-wide pattern changes (it did for 20*-s*-rc*).
          # Comments stay OUT of the block scalar: it is passed to the action
          # verbatim, not parsed as YAML.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag,enable=${{ !startsWith(github.ref_name, 'api-v') && !startsWith(github.ref_name, 'web-v') && !startsWith(github.ref_name, 'worker-v') }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},match=${{ matrix.app }}-v(.*),group=1
            type=semver,pattern={{major}}.{{minor}},match=${{ matrix.app }}-v(.*),group=1
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=aggregator-dpg-${{ matrix.app }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed ${REGISTRY}/${REPO}/${APP}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"
        env:
          REPO: ${{ github.repository }}
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}

      # Image scanning (Sec-Audit A2 — Blue-Dots-Economy/signals-dpg#300).
      # Scans the OS + system packages baked into the shipped artifact, which the
      # source/lockfile scan in security.yml structurally cannot see (an outdated
      # base-image library appears in no package.json). This repo carries the
      # largest dependency backlog of the six (76 open Dependabot alerts), so the
      # image surface is worth measuring rather than assuming.
      #
      # `github.repository` preserves the org's capitalisation
      # ("Blue-Dots-Economy"), which docker/metadata-action normalises for its own
      # tag outputs. A ref assembled by hand must be normalised too — an uppercase
      # path is an invalid image reference and Trivy would reject it.
      # Gated on the EVENT, not on `digest != ''`. Those look equivalent but are not:
      # with the default docker driver, build-push-action populates `digest` from the
      # locally-built image even when `push: false`, and Trivy would then resolve a
      # digest for an image that is in no registry (MANIFEST_UNKNOWN). This job does
      # configure buildx, where the output is empty on the PR path — but gating on
      # the same condition that drives `push:` above does not depend on that detail.
      - name: Resolve scanned image ref
        id: scanref
        if: github.event_name != 'pull_request'
        run: echo "ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # Scanned by digest, not by tag: buildx pushes straight to the registry
      # without loading into the local docker image store, so the action's
      # `imageid` output is not resolvable by Trivy. The digest guard also means
      # the PR path — which builds WITHOUT pushing, so no digest exists and
      # nothing is in any registry to pull — skips cleanly instead of failing.
      - name: Trivy image scan
        if: steps.scanref.outputs.ref != ''
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.scanref.outputs.ref }}
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"   # Phase A: report-only, never fails the build

      - name: Upload Trivy image SARIF
        if: always() && steps.scanref.outputs.ref != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          # One category per app so api/web/worker don't overwrite each other.
          category: trivy-image-${{ matrix.app }}

      # TODO: add smoke test `docker run --rm -p 3000:3000 <image> /health`
      #       once apps/api has a real HTTP server with a /health endpoint.
