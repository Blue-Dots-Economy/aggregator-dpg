version: 2
updates:
  # npm/pnpm — one entry at the workspace root covers all packages because
  # pnpm-lock.yaml holds the full dependency graph for the monorepo.
  - package-ecosystem: "npm"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

    ignore:
      # typescript-eslint does not support TS 7 yet — hold the major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest 4 needs vite 6 in lockstep — hold the major.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # @vitest/coverage-v8 peers on the EXACT vitest version, so its major can
      # only move when vitest's does — and vitest's is held above. #559 proposed
      # coverage-v8 4.1.10 against vitest 3, which passes CI (unmet peers are a
      # warning, and `test:coverage` is continue-on-error) while silently
      # producing no coverage for SonarCloud. Keep the two majors coupled.
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # tailwindcss 4 replaces the JS config with CSS-first `@theme` and drops the
      # postcss plugin for @tailwindcss/postcss — a migration, not a bump (#560
      # failed `Build`). Hold until the v4 migration is scheduled, otherwise every
      # 4.x release re-raises a PR that cannot go green.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — keeps CI workflow action versions current
  - package-ecosystem: "github-actions"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:15"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Docker base images — one entry per directory containing a Dockerfile
  - package-ecosystem: "docker"
    # Check manifests on and raise PRs against the integration branch;
    # security updates still target the default branch (GitHub limitation).
    target-branch: "feature"
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/worker"
      - "/infra/keycloak"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
