openapi: 3.1.0

info:
  title: Aggregator DPG API — standardized target
  version: 1.0.0
  description: |
    **Design target, not the shipped surface.** The live contract is the
    generated `openapi.json` at the repo root, produced from the Fastify +
    zod route schemas. This document describes the standardized surface the
    API is being migrated *to*: 28 endpoints, JSON only, uniform request and
    response envelopes.

    Conventions this spec encodes:

    - **JSON only.** No endpoint returns `text/html` or `text/csv`. Files are
      delivered as pre-signed URLs inside a JSON body; the frontend renders,
      serialises and downloads.
    - **No hyphens in paths.** Path segments are single lowercase words;
      hierarchy expresses compound nouns (`/v1/registration/link/create`, not
      `/v1/registration-link/create`).
    - **Action last.** Every path ends in a verb — `create`, `read`, `search`,
      `update`, `action`, `start`. Deliberately RPC-shaped rather than REST,
      matching the Beckn-style conventions used across the wider Signal Stack
      ecosystem.
    - **Discriminated subject types.** One endpoint serves many subject kinds
      via a `kind` field in the body, so a new subject type is a registry
      entry, not a new route.
    - **Flat responses.** Success bodies are the resource itself; failures are
      the shared `ErrorEnvelope`. Distinguished by HTTP status.
    - **Offset pagination** with `total`, except campaign job lists, which are
      append-only and use an opaque cursor.
    - **snake_case** on the wire, without exception.
    - `Idempotency-Key` accepted on every `create`.

    Identifiers and tokens travel in the request body, never in the path or
    query string. The only path parameter is `{channel}`, which selects a
    route rather than identifying a resource.

    ## Vocabulary

    "Aggregator" carries four unrelated meanings in this codebase — the
    product, the `aggregators` table, one `actor_type` value, and a domain
    focus — so it is not used as a subject noun on this contract.

    | Term | Means |
    |---|---|
    | `coordinator` | The intermediary who registers and onboards participants |
    | `organization` | The parent body that owns coordinators |
    | `domain` | Domain focus within the network, e.g. seeker or provider |
    | `coordinator_slug` | A coordinator's own public slug, used in link URLs |
    | `organization_slug` | A parent organization's slug — a different value |

    Every path names the subject it acts on. Participants are onboarded
    through two registration channels, which are siblings rather than
    unrelated features:

    | Channel | Path |
    |---|---|
    | shareable link | `/v1/participant/registration/link/*` |
    | bulk CSV upload | `/v1/participant/registration/upload/*` |

    `/v1/participant/onboarding/metrics/read` groups its counters by exactly
    that axis, so the paths and the metric dimension now agree. Coordinator
    and organization registration is a different subject and stays at
    `/v1/registration/create`, discriminated by `kind`.

    `coordinator_slug` replaces the former `orgSlug` path segment, which named
    a coordinator with the word "org": it resolves against the coordinator's
    own slug, never the parent organization's. A client that read the old name
    literally and passed a parent-org slug got a miss with no hint why.

    The word survives in three places only, all of them pre-existing
    identifiers rather than contract vocabulary: this document's title, the
    `aggregator_id` Keycloak claim (hand-configured protocol mappers, present
    in every issued token), and `audience: aggregator` on the consent scope,
    which is a key in the on-disk `consent.json` config.

    Spelling is `organization` throughout, matching the upstream Signals
    `organization.slug`, even where repository prose uses "organisation".

servers:
  - url: https://api.example.org
    description: Per-deployment API host. Internal-only — no browser reaches it directly.

tags:
  - name: health
    description: Liveness and readiness probes.
  - name: config
    description: Brand, network, support and consent configuration.
  - name: registration
    description: Coordinator and organization registration submissions.
  - name: approval
    description: Token-authenticated approval decisions reached from admin email.
  - name: organization
    description: Parent organisations (requires ORG_HIERARCHY_ENABLED).
  - name: coordinator
    description: The calling coordinator's own profile and its invites.
  - name: participant
    description: |
      Participants — the two registration channels (shareable link and bulk
      upload), listing, and onboarding metrics.
  - name: public
    description: Unauthenticated participant-facing endpoints.
  - name: campaign
    description: Async outbound and export jobs.
  - name: support
    description: Contact-support submissions.

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────────────────────────────────────── health ──
  /health/live:
    get:
      tags: [health]
      operationId: healthLive
      summary: Liveness probe
      description: 200 while the process is up. Container healthcheck target.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      summary: Readiness probe
      description: Checks backing dependencies before the instance accepts traffic.
      security: []
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  dependencies:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ready, unreachable]
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ─────────────────────────────────────────────────────────────── config ──
  /v1/config/read:
    post:
      tags: [config]
      operationId: configRead
      summary: Read a configuration scope
      description: |
        Absorbs the former `/v1/aggregator-config`, `/v1/support/config`,
        `/v1/participant-consent` and `GET /v1/bulk-uploads/template`.

        The CSV upload template belongs here rather than under participants:
        it is a resolved schema, the curated sample rows shipped in the network
        config, and the network's array delimiter — configuration, with nothing
        per-participant or per-job in it. It is also returned as **data**, not
        as the `text/csv` attachment the old endpoint sent; the frontend
        serialises and downloads.

        **Authorisation is per scope, enforced inside the handler** — merging
        these must not widen access:

        | scope | auth |
        |---|---|
        | `network` | public |
        | `consent` | public |
        | `support` | bearer |
        | `upload_template` | bearer |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: [network, support, consent, upload_template]
                  description: Which configuration document to return.
                audience:
                  type: string
                  enum: [org, aggregator, participant]
                  description: Consent audience. Required when `scope=consent`.
                participant_type:
                  type: string
                  description: Network domain id. Required when `scope=upload_template`.
      responses:
        '200':
          description: Configuration for the requested scope.
          content:
            application/json:
              schema:
                type: object
                required: [scope, config]
                properties:
                  scope:
                    type: string
                    enum: [network, support, consent, upload_template]
                  config:
                    oneOf:
                      - type: object
                        additionalProperties: true
                        description: |
                          `network` — brand, logo, favicon, domains and
                          registration modes. `support` —
                          `{ enabled, attachments: {...} }`. `consent` — the
                          versioned consent document.
                      - $ref: '#/components/schemas/UploadTemplate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────────────────────────────────── registration ──
  /v1/registration/create:
    post:
      tags: [registration]
      operationId: registrationCreate
      summary: Submit a coordinator or organisation registration
      description: |
        Absorbs the former `/v1/aggregator-registrations/create` and
        `/v1/orgs/create`, which ran structurally identical flows.

        For every `kind`: writes the append-only consent-ledger row **before**
        provisioning anything external, creates the pending row, creates a
        disabled Keycloak principal, then emails the approver a signed review
        link. Fail-closed — no subject is provisioned without a consent record.

        Resubmitting from a rejected or expired state reclaims the existing
        row and reports `reclaimed: true`; consent is recorded only on a fresh
        registration, never on reclaim.

        `kind: organization` returns **404** when `ORG_HIERARCHY_ENABLED=false`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, profile, consent]
              properties:
                kind:
                  $ref: '#/components/schemas/SubjectKind'
                profile:
                  type: object
                  additionalProperties: true
                  description: |
                    Schema-driven payload validated against the active
                    `registration.v1` schema for this network. Field set is
                    config-owned, so it is not enumerated here.
                consent:
                  $ref: '#/components/schemas/ConsentInput'
                org_id:
                  type: string
                  format: uuid
                  description: |
                    Parent organisation. Required for `kind=coordinator` when
                    ORG_HIERARCHY_ENABLED, unless `invite_token` is supplied.
                invite_token:
                  type: string
                  description: Coordinator invite token, when registering from an invite link.
      responses:
        '201':
          description: Registration accepted and pending approval.
          headers:
            Location:
              description: Path at which the registration can be read.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [id, kind, status, reclaimed]
                properties:
                  id: { type: string, format: uuid }
                  kind: { $ref: '#/components/schemas/SubjectKind' }
                  status: { $ref: '#/components/schemas/RegistrationStatus' }
                  reclaimed:
                    type: boolean
                    description: True when an earlier rejected or expired row was reused.
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────────────────────────────────────── approval ──
  /v1/approval/read:
    post:
      tags: [approval]
      operationId: approvalRead
      summary: Read a pending approval for rendering
      description: |
        Absorbs `GET /admin/v1/aggregator-registrations/read/:id` and
        `GET /admin/v1/orgs/read/:id`, which returned `text/html`.

        Reached from the approver's email link. The approver has **no session**
        — the signed token in the body is the credential. Returns everything
        the approval page needs to render every outcome, including expired
        links and already-decided subjects, so no rendering happens server-side.

        The handler asserts `token.kind == kind` and `token.subject_id == id`
        before anything else: a token minted for one subject type must never
        decide another.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRef' }
      responses:
        '200':
          description: Approval state and the subject being decided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/approval/action:
    post:
      tags: [approval]
      operationId: approvalAction
      summary: Approve, reject, or renew an expired approval link
      description: |
        Absorbs four former HTML routes — the aggregator and org `decision`
        and `renew` endpoints.

        - `approve` / `reject` require a **valid** token. The decision is a
          compare-and-set on the subject's status column, which is the single
          source of truth and the single-use guard: a duplicate click on a
          terminal subject is reported through `prior_decision`, not by
          resending mail.
        - `renew` requires an **expired but signature-valid** token and mints
          a fresh one. It never sends a self-email to the reviewer.

        Side effects diverge by `kind` — `coordinator` enables the Keycloak
        user and binds `parent_org_id`; `org` enables the owner, grants the
        `org_owner` realm role and creates the mirrored group — but the
        contract does not.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ApprovalRef'
                - type: object
                  required: [action]
                  properties:
                    action:
                      type: string
                      enum: [approve, reject, renew]
                    reason:
                      type: string
                      maxLength: 2000
                      description: Operator note. Surfaced to the applicant on reject.
      responses:
        '200':
          description: Action applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Subject already in a terminal state, or `renew` attempted against a
            still-valid token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────────────────────────────────── organization ──
  /v1/organization/search:
    post:
      tags: [organization]
      operationId: organizationSearch
      summary: Search parent organisations
      description: |
        Replaces `GET /v1/orgs`, which hard-coded `listActive()` — a filtered
        view frozen into a path. Status and date range are now filters.

        Backs the coordinator-registration organisation picker, so it is
        reachable without an approved session. Returns identity fields only —
        never contact details or counts.

        Returns **404** when `ORG_HIERARCHY_ENABLED=false`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    status:
                      $ref: '#/components/schemas/RegistrationStatus'
                    created_at:
                      $ref: '#/components/schemas/DateRange'
                    q:
                      type: string
                      description: Case-insensitive match on display name or slug.
                page: { $ref: '#/components/schemas/PageRequest' }
                sort: { $ref: '#/components/schemas/SortRequest' }
      responses:
        '200':
          description: Matching organisations.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
                  page: { $ref: '#/components/schemas/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ────────────────────────────────────────────────────────── coordinator ──
  /v1/coordinator/profile/read:
    post:
      tags: [coordinator]
      operationId: coordinatorProfileRead
      summary: Read the calling coordinator's profile
      description: |
        `aggregator_id` is always taken from the token and never from the
        request. There is no endpoint for reading another coordinator's profile.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { type: string }
                  description: Sparse fieldset. Omit for the full profile.
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordinatorProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/coordinator/profile/update:
    post:
      tags: [coordinator]
      operationId: coordinatorProfileUpdate
      summary: Update the calling coordinator's profile
      description: |
        Partial update, restricted to the fields the active schema marks
        `x-updatable`. Unknown keys are rejected rather than ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: true
              description: Subset of updatable profile fields.
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordinatorProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ─────────────────────────────────────────────────────────────── invite ──
  /v1/coordinator/invite/create:
    post:
      tags: [coordinator]
      operationId: coordinatorInviteCreate
      summary: Mint coordinator invites
      description: |
        Replaces `POST /admin/v1/invites`.

        Authenticated by the organisation owner's **grant token** in the body —
        an owner cannot log in, so no bearer exists. Three outcomes, all keyed
        off the grant:

        - valid grant → one invite minted per recipient, refreshing any live
          invite for the same address;
        - expired but signature-valid grant → **nothing is minted**; a fresh
          grant is mailed to the owner and `recovered: true` is returned. This
          is the mandatory mitigation against a leaked grant;
        - invalid grant → `GRANT_INVALID`.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, recipients]
              properties:
                grant:
                  type: string
                  description: Signed owner grant token.
                recipients:
                  type: array
                  minItems: 1
                  items: { type: string, format: email }
      responses:
        '200':
          description: |
            Invites minted, or grant recovery performed. Inspect `recovered`.
          content:
            application/json:
              schema:
                type: object
                required: [recovered, invites]
                properties:
                  recovered:
                    type: boolean
                    description: True when the grant had expired and a fresh one was mailed instead.
                  invites:
                    type: array
                    items:
                      type: object
                      required: [email, status]
                      properties:
                        email: { type: string, format: email }
                        status: { type: string, enum: [minted, refreshed, skipped] }
                        expires_at: { type: string, format: date-time, nullable: true }
                        skip_reason: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ──────────────────────────────────────────────── participant / upload ──
  /v1/participant/registration/upload/create:
    post:
      tags: [participant]
      operationId: participantRegistrationUploadCreate
      summary: Create a bulk-upload job
      description: |
        Returns a short-lived pre-signed URL the client PUTs the CSV to. The
        API never receives the file body.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_type]
              properties:
                participant_type:
                  type: string
                  description: Network domain id the rows belong to.
      responses:
        '201':
          description: Job created; upload the file to `upload_url`.
          content:
            application/json:
              schema:
                type: object
                required: [id, upload_url, content_type, expires_at]
                properties:
                  id: { type: string, format: uuid }
                  upload_url: { type: string, format: uri }
                  content_type: { type: string, enum: ['text/csv'] }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/participant/registration/upload/start:
    post:
      tags: [participant]
      operationId: participantRegistrationUploadStart
      summary: Start processing an uploaded file
      description: |
        Enqueues the file for streamed parsing. Requires the operator's
        attestation that the participants consented to onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, attestation]
              properties:
                id: { type: string, format: uuid }
                attestation:
                  type: boolean
                  description: Must be true. Recorded on the consent ledger.
      responses:
        '202':
          description: Accepted for processing.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BulkUpload'
                  - type: object
                    properties:
                      duplicate:
                        type: boolean
                        description: True when this file was already processed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/participant/registration/upload/search:
    post:
      tags: [participant]
      operationId: participantRegistrationUploadSearch
      summary: Search the caller's bulk-upload jobs, or read one by id
      description: |
        Also absorbs the single-job read and the former
        `GET /v1/bulk-uploads/:id/errors.csv`. Pass `filters.id` to address one
        job; the response shape is unchanged, so a caller polling a list and a
        caller watching one job use the same parser.

        A dedicated read endpoint existed but had no caller: the status poll
        already went through this list, and the upload flow reads its status
        off the `start` response.

        `include: [errors_report]` attaches the per-row error report. The old
        errors endpoint reported **normal states as HTTP errors** — `410` while
        the job was still running, `404` when every row passed — forcing the UI
        to hide its download button by catching failures. Those are now
        `errors_report.state` values.

        The pre-signed URL is minted only when `include` asks for it *and* the
        job completed with at least one failed row, so a 3-second status poll
        never triggers an object-store round-trip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Address a single job. Returns zero or one item.
                    status:
                      type: array
                      items: { $ref: '#/components/schemas/BulkUploadStatus' }
                    participant_type: { type: string }
                    created_at: { $ref: '#/components/schemas/DateRange' }
                page: { $ref: '#/components/schemas/PageRequest' }
                sort: { $ref: '#/components/schemas/SortRequest' }
                include:
                  type: array
                  items: { type: string, enum: [errors_report] }
                  description: |
                    Attach the error report to each item. Only meaningful
                    alongside `filters.id`; requesting it for a broad search
                    would presign one URL per row.
      responses:
        '200':
          description: Matching jobs.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/BulkUpload'
                        - type: object
                          properties:
                            errors_report:
                              oneOf:
                                - type: 'null'
                                - $ref: '#/components/schemas/ErrorsReport'
                  page: { $ref: '#/components/schemas/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────────────────── participant / search+metrics ──
  /v1/participant/search:
    post:
      tags: [participant]
      operationId: participantSearch
      summary: Search participants owned by the calling coordinator
      description: |
        Absorbs `GET /v1/dashboard` and `GET /v1/dashboard/items`, which both
        answered "participants for this coordinator, scoped to a domain" and
        differed only in what they attached — a pre-computed rollup versus
        lifecycle tile counts. Both are now `include` options.

        Draft and live profiles are returned by default; paused and retired are
        excluded unless `filters.lifecycle` names them, while `tiles` always
        counts the full dataset.

        **Partially pinned contract.** `items[]` is proxied from the upstream
        Signals Stack and only its stable identity fields are specified here;
        the remainder is passthrough. Do not treat the absence of a field in
        this spec as evidence it is absent on the wire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filters]
              properties:
                filters:
                  type: object
                  required: [domain]
                  properties:
                    domain:
                      type: string
                      description: Network domain id. No default — an omitted domain is an error, not a guess.
                    lifecycle:
                      type: string
                      enum: [draft, live, paused, account_only]
                    status: { type: string }
                page: { $ref: '#/components/schemas/PageRequest' }
                include:
                  type: array
                  items: { type: string, enum: [rollup, tiles] }
                refresh:
                  type: boolean
                  default: false
                  description: Bypass the upstream TTL cache.
      responses:
        '200':
          description: Matching participants, plus any requested aggregates.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ParticipantItem' }
                  page: { $ref: '#/components/schemas/PageResponse' }
                  rollup:
                    type: object
                    additionalProperties: true
                    description: Upstream pre-computed counters, when requested.
                  tiles:
                    type: object
                    additionalProperties: { type: integer }
                    description: Lifecycle counts over the full dataset, when requested.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/participant/onboarding/metrics/read:
    post:
      tags: [participant]
      operationId: participantOnboardingMetricsRead
      summary: Read participant-onboarding counters for the calling coordinator
      description: |
        Absorbs `GET /v1/onboarding/summary` and `GET /v1/onboarding/by-source`,
        which ran the same aggregate query and differed only by `GROUP BY
        source`. That is now `group_by`.

        Renamed from `onboarding` because the old path named neither the
        subject being onboarded nor whose counters these are.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    period: { $ref: '#/components/schemas/DateRange' }
                group_by:
                  type: array
                  items: { type: string, enum: [source] }
      responses:
        '200':
          description: Onboarding counters, grouped as requested.
          content:
            application/json:
              schema:
                type: object
                required: [aggregator_id, period, totals]
                properties:
                  aggregator_id: { type: string }
                  period: { $ref: '#/components/schemas/DateRange' }
                  totals: { $ref: '#/components/schemas/OnboardingCounters' }
                  groups:
                    type: array
                    description: Present only when `group_by` was supplied.
                    items:
                      allOf:
                        - type: object
                          required: [source]
                          properties:
                            source: { type: string }
                        - $ref: '#/components/schemas/OnboardingCounters'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ──────────────────────────────────────────── registration link (owner) ──
  /v1/participant/registration/link/create:
    post:
      tags: [participant]
      operationId: participantRegistrationLinkCreate
      summary: Create a shareable participant registration link
      description: |
        The QR image is generated on demand from `public_url` and is not
        persisted, so no object-store round-trip happens here.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, registration_mode]
              properties:
                domain: { type: string }
                registration_mode: { type: string }
                slug:
                  type: string
                  description: Optional preferred slug. A collision returns 409.
                context:
                  type: object
                  additionalProperties: true
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: Link created in draft status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/participant/registration/link/update:
    post:
      tags: [participant]
      operationId: participantRegistrationLinkUpdate
      summary: Update a registration link, including its lifecycle status
      description: |
        Absorbs `POST /v1/links/:id/activate` and `/deactivate`, which each
        duplicated this handler's auth, ownership lookup and response shape to
        flip a single column. Status is now a field.

        Only draft links may have `slug`, `context` or `expires_at` edited;
        `domain` and `registration_mode` are immutable. Status transitions are
        idempotent, and a retired link can never be reactivated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              minProperties: 2
              properties:
                id: { type: string, format: uuid }
                status:
                  type: string
                  enum: [live, paused, retired]
                slug: { type: string }
                context:
                  type: object
                  additionalProperties: true
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Updated link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/participant/registration/link/search:
    post:
      tags: [participant]
      operationId: participantRegistrationLinkSearch
      summary: Search the caller's registration links
      description: Each item carries its rolled-up onboarding metrics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    domain: { type: string }
                    status:
                      type: array
                      items: { type: string, enum: [draft, live, paused, retired] }
                    created_at: { $ref: '#/components/schemas/DateRange' }
                page: { $ref: '#/components/schemas/PageRequest' }
                sort: { $ref: '#/components/schemas/SortRequest' }
      responses:
        '200':
          description: Matching links.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RegistrationLink' }
                  page: { $ref: '#/components/schemas/PageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ─────────────────────────────────────────────────────────────── public ──
  /v1/public/participant/registration/link/read:
    post:
      tags: [public]
      operationId: publicParticipantRegistrationLinkRead
      summary: Resolve a public registration link
      description: |
        Returns the form schema, consent document reference and validity for a
        link addressed by the owning coordinator's slug plus the link slug. Unauthenticated and
        rate-limited. An inactive, expired or unknown link is reported through
        `state`, never by leaking whether the slug exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coordinator_slug, slug]
              properties:
                coordinator_slug: { type: string }
                slug: { type: string }
      responses:
        '200':
          description: Link resolution.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [open, expired, inactive, not_found]
                  domain: { type: string, nullable: true }
                  registration_mode: { type: string, nullable: true }
                  schema_id: { type: string, nullable: true }
                  consent:
                    type: object
                    nullable: true
                    additionalProperties: true
                  context:
                    type: object
                    nullable: true
                    additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/participant/identity/lookup:
    post:
      tags: [public]
      operationId: publicParticipantIdentityLookup
      summary: Probe an identity before opening the registration form
      description: |
        Was `GET /public/v1/aggregators/:orgSlug/lookup`, which carried
        personally identifying values in the query string — they reached access
        logs, browser history and referrer headers. The probe is now a POST
        body.

        Read-only and tri-state. Returns whether a matching subject is already
        onboarded so the form can pre-fill or redirect, without confirming
        anything an unauthenticated caller should not learn.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coordinator_slug, identity]
              properties:
                coordinator_slug: { type: string }
                identity:
                  type: object
                  additionalProperties: true
                  description: Schema-driven identity fields, e.g. phone or email.
      responses:
        '200':
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [unknown, owned_here, owned_elsewhere]
                  lifecycle_summary:
                    type: object
                    nullable: true
                    additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/public/participant/registration/create:
    post:
      tags: [public]
      operationId: publicParticipantRegistrationCreate
      summary: Submit a participant registration through a link
      description: |
        Unauthenticated and rate-limited. Records the participant consent
        ledger row before provisioning; fail-closed.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coordinator_slug, slug, profile, consent]
              properties:
                coordinator_slug: { type: string }
                slug: { type: string }
                profile:
                  type: object
                  additionalProperties: true
                consent: { $ref: '#/components/schemas/ConsentInput' }
      responses:
        '201':
          description: Participant registered.
          content:
            application/json:
              schema:
                type: object
                required: [submission_id, status]
                properties:
                  submission_id: { type: string }
                  status: { type: string }
                  item_id: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ───────────────────────────────────────────────────────────── campaign ──
  /v1/campaign/{channel}/create:
    post:
      tags: [campaign]
      operationId: campaignCreate
      summary: Submit an async campaign job
      description: |
        Absorbs the three per-channel submit routes, which already funnelled
        into one shared handler differing only by a config object, **and** the
        former synchronous `POST /v1/dashboard/export/profiles`.

        That sync route and the `export` channel decrypted the same profiles
        through the same upstream call and produced the same CSV — two
        implementations and two personally-identifying-data egress paths to
        audit. `delivery` collapses them: `email` mails a short-lived
        pre-signed link, `inline` exposes the same link on the job's `result`.

        Persists the job row and its items and enqueues the worker in one
        transaction. Rate limits and the active-job cap are per channel, so an
        export burst cannot throttle voice. Never echoes personally
        identifying data; the export recipient is resolved server-side from
        the token, so a caller cannot redirect delivery.
      parameters:
        - $ref: '#/components/parameters/CampaignChannel'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  minItems: 1
                  items: { type: string }
                metadata:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                content:
                  type: object
                  additionalProperties: true
                  description: Channel-shaped payload. Voice forwards a provider-shaped body.
                delivery:
                  type: string
                  enum: [email, inline]
                  default: email
                  description: |
                    `export` only. `inline` returns the download link on the
                    job result instead of mailing it.
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/CampaignJobStatus' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/campaign/{channel}/read:
    post:
      tags: [campaign]
      operationId: campaignRead
      summary: Read one campaign job's status and per-item outcomes
      description: |
        Scoped to the caller's organisation and to the channel in the path. A
        job belonging to another organisation or channel returns **403, never
        404** — a 404 would confirm the id does not exist, and a 200-or-404
        pair is an enumeration oracle.
      parameters:
        - $ref: '#/components/parameters/CampaignChannel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_id]
              properties:
                job_id: { type: string, format: uuid }
      responses:
        '200':
          description: Job detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignJobDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/campaign/{channel}/search:
    post:
      tags: [campaign]
      operationId: campaignSearch
      summary: Search the organisation's campaign jobs for a channel
      description: |
        The one **cursor-paginated** collection in this API. Job logs are
        append-only and are never addressed by page number, so a stable cursor
        beats an offset that shifts under concurrent inserts. Every other
        collection uses offset plus total, because the dashboard renders
        numbered pages and a "select all N matching" affordance.
      parameters:
        - $ref: '#/components/parameters/CampaignChannel'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: object
                  properties:
                    status:
                      type: array
                      items: { $ref: '#/components/schemas/CampaignJobStatus' }
                    created_at: { $ref: '#/components/schemas/DateRange' }
                page: { $ref: '#/components/schemas/CursorPageRequest' }
      responses:
        '200':
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CampaignJobSummary' }
                  page: { $ref: '#/components/schemas/CursorPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/campaign/dump/read:
    post:
      tags: [campaign]
      operationId: campaignDumpRead
      summary: Read a link to the latest whole-network non-PII signals dump
      description: |
        System-authenticated. Returns a pre-signed URL for the most recent
        dump published by the upstream export cron — never the bytes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Dump location.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, published_at, content_type]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  published_at: { type: string, format: date-time }
                  content_type: { type: string }
                  size_bytes: { type: integer, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ────────────────────────────────────────────────────────────── support ──
  /v1/support/ticket/create:
    post:
      tags: [support]
      operationId: supportTicketCreate
      summary: Send a contact-support message
      description: |
        Available to any authenticated coordinator regardless of approval
        status — a blocked applicant is exactly who needs to reach support.

        Requires `SUPPORT_EMAIL` to be configured for the instance; when it is
        not, `/v1/config/read` reports `enabled: false` and this endpoint
        returns 503. Attachments are size- and MIME-checked server-side and
        rate-limited per coordinator.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string, maxLength: 200 }
                message: { type: string, maxLength: 10000 }
                attachments:
                  type: array
                  items:
                    type: object
                    required: [filename, content_type, data]
                    properties:
                      filename: { type: string }
                      content_type: { type: string }
                      data: { type: string, contentEncoding: base64 }
      responses:
        '202':
          description: Message accepted for delivery.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean }
                  reference: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: Attachments exceed the configured total byte budget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: Mail transport rejected the message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak access token. Issuer-scoped **and** client-scoped: `azp` must
        appear in the allow-list, with an optional audience check. Both user
        and service-account tokens use this scheme; a service account is
        recognised by its `service-account-<client>` subject.

        `aggregator_id` is always read from the token claim and never trusted
        from the request. Endpoints marked `security: []` are reached either
        anonymously or with a signed token carried in the request body — an
        approval token, an owner grant, or an invite — because the caller has
        no session by design.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: |
        Replaying a create with the same key returns the original outcome
        instead of duplicating the side effect.

    CampaignChannel:
      name: channel
      in: path
      required: true
      schema:
        type: string
        enum: [export, voice, email]
      description: |
        Selects the channel handler. The only path parameter in this API, and
        a route selector rather than a resource identifier.

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      description: |
        Emitted by the global error handler for every non-2xx response. The
        only wrapped shape in the API — success bodies are the resource itself.
      properties:
        error:
          type: object
          required: [code, title, detail, request_id, timestamp]
          properties:
            code:
              type: string
              description: Stable machine-readable code. Branch on this, not on the message.
            title: { type: string }
            detail: { type: string }
            docs: { type: string, format: uri }
            fields:
              type: object
              additionalProperties: true
              description: Field-level validation detail, keyed by field path.
            request_id:
              type: string
              description: Correlates with the inbound `x-request-id` across services.
            timestamp: { type: string, format: date-time }

    PageRequest:
      type: object
      description: Offset pagination. The default across this API.
      properties:
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        offset: { type: integer, minimum: 0, default: 0 }

    PageResponse:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          description: Total matching rows, so the UI can render page numbers and "select all N".
        limit: { type: integer }
        offset: { type: integer }

    CursorPageRequest:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        cursor: { type: string, description: Opaque. Pass back the previous `next_cursor`. }

    CursorPageResponse:
      type: object
      required: [limit, next_cursor]
      properties:
        limit: { type: integer }
        next_cursor: { type: string, nullable: true }

    SortRequest:
      type: array
      items:
        type: object
        required: [field, order]
        properties:
          field: { type: string }
          order: { type: string, enum: [asc, desc] }

    DateRange:
      type: object
      description: Half-open range. Both bounds optional.
      properties:
        after: { type: string, format: date-time, nullable: true }
        before: { type: string, format: date-time, nullable: true }

    SubjectKind:
      type: string
      enum: [coordinator, organization]
      description: |
        The subject type a registration or approval acts on. Backed by a
        handler registry, so a further subject type is a registry entry rather
        than a new endpoint. Clients must tolerate unknown future values.

    RegistrationStatus:
      type: string
      enum: [pending, active, inactive]
      description: |
        Source of truth for whether a subject was approved. The status
        compare-and-set is also the single-use guard on an approval token.

    ConsentInput:
      type: object
      required: [accepted, version]
      description: |
        Recorded on the append-only consent ledger before any external
        provisioning. The server stamps the authoritative timestamp; a
        client-supplied one is ignored.
      properties:
        accepted: { type: boolean }
        version: { type: string }
        audience: { type: string, enum: [org, aggregator, participant] }

    ApprovalRef:
      type: object
      required: [kind, id, token]
      properties:
        kind: { $ref: '#/components/schemas/SubjectKind' }
        id: { type: string, format: uuid }
        token:
          type: string
          description: |
            Signed approval token from the approver's email. Carried in the
            body, never the query string, so it stays out of access logs and
            referrer headers. The handler asserts the token's own `kind` and
            subject id match this request before doing anything else.

    ApprovalView:
      type: object
      required: [kind, id, status, prior_decision, token, allowed_actions]
      description: |
        Everything the approval page needs to render any outcome — pending,
        already decided, or expired link — so nothing is rendered server-side.
      properties:
        kind: { $ref: '#/components/schemas/SubjectKind' }
        id: { type: string, format: uuid }
        subject:
          type: object
          description: Shape varies by `kind`.
          properties:
            email: { type: string, format: email }
            invited_email: { type: string, format: email, nullable: true }
            association: { type: string, description: Display name of the registering body. }
            actor_type: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        prior_decision:
          type: string
          nullable: true
          enum: [approved, rejected, null]
          description: Non-null when the subject was already decided. Drives the duplicate-click view.
        decided_at: { type: string, format: date-time, nullable: true }
        token:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [valid, expired, consumed] }
            expires_at: { type: string, format: date-time, nullable: true }
        allowed_actions:
          type: array
          description: |
            Supplied by the registry, so the page renders whatever a subject
            type supports without a UI change per type.
          items: { type: string, enum: [approve, reject, renew] }

    Organization:
      type: object
      required: [id, slug, display_name]
      description: Identity fields only. Never contact details or counts.
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        created_at: { type: string, format: date-time }

    CoordinatorProfile:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        parent_org_id: { type: string, format: uuid, nullable: true }
        profile:
          type: object
          additionalProperties: true
          description: Schema-driven field set, rendered read-only by the portal.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BulkUploadStatus:
      type: string
      enum: [pending, uploaded, file_validating, row_processing, finalising, completed, failed]

    BulkUpload:
      type: object
      required: [id, participant_type, status, counts, created_at]
      properties:
        id: { type: string, format: uuid }
        participant_type: { type: string }
        status: { $ref: '#/components/schemas/BulkUploadStatus' }
        counts:
          type: object
          required: [total_rows, passed, failed, skipped]
          properties:
            total_rows: { type: integer, nullable: true }
            passed: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UploadTemplate:
      type: object
      required: [participant_type, source, array_delimiter, columns, rows, suggested_filename]
      description: |
        CSV upload template as data. Returned by `/v1/config/read` with
        `scope: upload_template`; the frontend serialises it to a file.
      properties:
        participant_type: { type: string }
        source:
          type: string
          enum: [curated, schema]
          description: |
            `curated` — real editable rows shipped with the network config.
            `schema` — synthesised from the participant schema.
        array_delimiter: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [name, required, type]
            properties:
              name: { type: string }
              required: { type: boolean }
              type: { type: string }
              example: { type: string, nullable: true }
              help_text: { type: string, nullable: true }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        suggested_filename: { type: string }

    ErrorsReport:
      type: object
      required: [state]
      description: |
        Availability of the per-row error report as **data**. The endpoint this
        replaced signalled `not_ready` as 410 and `none` as 404, forcing
        callers to treat success as failure.
      properties:
        state:
          type: string
          enum: [not_ready, none, ready]
          description: |
            `not_ready` — job has not finalised. `none` — finalised with every
            row passing, so no report exists. `ready` — a report is downloadable.
        url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        content_type: { type: string, nullable: true }

    RegistrationLink:
      type: object
      required: [id, slug, domain, registration_mode, status, public_url]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        domain: { type: string }
        registration_mode: { type: string }
        status: { type: string, enum: [draft, live, paused, retired] }
        public_url: { type: string, format: uri }
        context:
          type: object
          additionalProperties: true
        metrics: { $ref: '#/components/schemas/OnboardingCounters' }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OnboardingCounters:
      type: object
      required: [total, passed, failed, skipped]
      properties:
        total: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }

    ParticipantItem:
      type: object
      required: [id]
      description: |
        Proxied from the upstream Signals Stack. Only the stable identity
        fields are pinned; the rest is passthrough, so absence from this spec
        is not evidence of absence on the wire.
      additionalProperties: true
      properties:
        id: { type: string }
        lifecycle: { type: string }
        domain: { type: string }

    CampaignJobStatus:
      type: string
      enum: [queued, processing, completed, partially_failed, failed]
      description: Derived from per-item counts rather than stored independently.

    CampaignJobSummary:
      type: object
      required: [job_id, channel, status, counts, created_at]
      properties:
        job_id: { type: string, format: uuid }
        channel: { type: string, enum: [export, voice, email] }
        status: { $ref: '#/components/schemas/CampaignJobStatus' }
        counts:
          type: object
          required: [total, succeeded, failed, skipped]
          properties:
            total: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CampaignJobDetail:
      allOf:
        - $ref: '#/components/schemas/CampaignJobSummary'
        - type: object
          properties:
            metadata:
              type: object
              additionalProperties: true
            provider_response:
              nullable: true
              description: |
                Raw provider payload, curated by the writer to a safe field
                allow-list before storage.
            result:
              type: object
              nullable: true
              description: 'Present on `export` when `delivery` is `inline`.'
              properties:
                url: { type: string, format: uri }
                expires_at: { type: string, format: date-time }
                content_type: { type: string }
            items:
              type: array
              items:
                type: object
                required: [item_id, status]
                properties:
                  item_id: { type: string }
                  status: { type: string }
                  provider_ref: { type: string, nullable: true }
                  reason: { type: string, nullable: true }

  responses:
    BadRequest:
      description: Malformed JSON or a structurally invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing, expired or untrusted credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: |
        Authenticated but not entitled to this resource. Also returned in
        place of 404 for cross-tenant references, so a caller cannot use the
        status code to discover which ids exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: |
        No such resource, or the feature is disabled for this deployment —
        `kind: organization` when the organization hierarchy is off.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State conflict — slug collision, terminal status, or duplicate submission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnprocessableEntity:
      description: |
        Well-formed JSON that fails semantic validation. Field detail is in
        `error.fields`. Distinct from 400, which is reserved for malformed
        payloads.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: A backing dependency is unavailable. Retry with backoff.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
