<text x="1055.0" y="306.0" fill="#868e96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" text-anchor="middle" xml:space="preserve">not in compose by default</text>
<text x="590.0" y="480.9" fill="#e03131" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle" xml:space="preserve">participant PII is stored in the clear:  participants.data, bulk rows in Redis, and the export CSVs on S3 carry no encryption at rest</text>
<text x="590.0" y="506.4" fill="#868e96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" xml:space="preserve">the encrypted blob lives upstream in signals-dpg   -   this DPG reads it decrypted via POST /api/v1/admin/participant/decrypt</text>
<text x="590.0" y="532.5" fill="#868e96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" xml:space="preserve">retention sweeps bulk_uploads and link_submissions at 90 days;  participants and onboarding are kept indefinitely by design</text>
