sonar.organization=blue-dots-economy
sonar.projectKey=Blue-Dots-Economy_aggregator-dpg
sonar.projectName=aggregator-dpg
sonar.sourceEncoding=UTF-8

# Monorepo: analyze everything under one project, mark test files via
# sonar.test.inclusions rather than splitting sonar.sources/sonar.tests —
# tests live alongside source (*.test.ts) or under __tests__/.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,infra/**,docs/**,local-setup/**,openapi.json,**/*.md,**/drizzle/migrations/**

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/*.config.*,**/testing.ts,**/testing/**,**/_template/**,**/scripts/**,**/*.d.ts,packages/db-schema/src/schema-types.ts

# One lcov.info per package/app — each vitest.config.ts's coverage.reporter
# includes 'lcov' so `pnpm -w test:coverage` produces these before the scan.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,apps/worker/coverage/lcov.info,packages/config-loader/coverage/lcov.info,packages/consent-ledger/coverage/lcov.info,packages/db-schema/coverage/lcov.info,packages/network-config/coverage/lcov.info,packages/queue/coverage/lcov.info,packages/schema-loader/coverage/lcov.info,packages/schema-service/coverage/lcov.info,packages/shared-primitives/coverage/lcov.info,packages/signalstack-writer/coverage/lcov.info,packages/_template/coverage/lcov.info

# Read-only operator SQL (pre-flight / verify counts run by the migration
# tool): the PL/SQL rules against EXISTS sub-queries (S1138) and repeated
# literals (S1192) target procedural Oracle code. In these scripts EXISTS is
# the idiomatic Postgres semi-join and the literals are enum values; rewriting
# them would cost readability with no behaviour gain. Every other rule still
# applies to these files.
sonar.issue.ignore.multicriteria=sqlExists,sqlLiterals
sonar.issue.ignore.multicriteria.sqlExists.ruleKey=plsql:S1138
sonar.issue.ignore.multicriteria.sqlExists.resourceKey=scripts/sql/**
sonar.issue.ignore.multicriteria.sqlLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sqlLiterals.resourceKey=scripts/sql/**
