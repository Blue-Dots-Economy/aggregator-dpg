# Bundled email copy — the COMPLETE key list. Every key a case declares must
# exist here; a hole is a build defect, and `assertMessagesComplete()` fails at
# boot rather than letting a blank email ship.
#
# Override layers, lowest precedence first:
#   1. this file (bundled defaults)
#   2. config/<network>/emails/messages.properties
#   3. config/<network>/<brand>/emails/messages.properties
#   4. EMAIL_MESSAGES_PATH (per-instance escape hatch, wins over everything)
# Layers 2-4 are PARTIAL: list only the keys you are changing.
#
# Format: `key=value`, one per line, split at the first `=`. `#` and `!` start
# a comment. No escapes, no line continuation, so every value is single-line.
#
# Values are HTML fragments limited to <b> <strong> <i> <em> <a> <br>. Block
# styling (paragraph, heading, callout, button) is owned by the code — do not
# put style attributes here. The plain-text part of every email is DERIVED
# from these same values, so copy cannot drift between the two.
#
# Placeholders are {{likeThis}}. Each case declares its tokens and their type
# in `email-cases.ts`; a `text` token is escaped on substitution, an `html`
# token is inserted raw and may only be built in code. An unprovided token
# renders as literal {{text}} rather than disappearing.
#
# {{brandShort}} and {{brandLong}} are available to every case and come from
# the deployment's resolved network/brand config.

# ── Applicant approved (coordinator registration accepted) ──────────────
applicant_approved.subject=Your {{brandShort}} aggregator account is approved
applicant_approved.heading=Welcome to {{brandShort}}, {{contactName}}.
applicant_approved.intro=Your application for <strong>{{association}}</strong> has been approved. You can sign in to {{brandLong}} now.
applicant_approved.identifier=Use the email or mobile number you registered (<strong>{{identifier}}</strong>) — we'll send a one-time code to verify it.
applicant_approved.cta=Sign in to {{brandShort}}
applicant_approved.footnote=Trouble signing in? Reply to this email and the {{brandShort}} team will help.

# ── Applicant rejected ──────────────────────────────────────────────────
# `entityLabel` is `aggregator` for coordinators, `organisation` for orgs.
# The greeting has two variants because the org flow has no owner-name column.
applicant_rejected.subject=Update on your {{brandShort}} {{entityLabel}} application
applicant_rejected.greeting=Hi {{contactName}},
applicant_rejected.greeting_anonymous=Hi there,
applicant_rejected.intro=Thanks for applying to onboard <strong>{{association}}</strong> as a {{brandShort}} {{entityLabel}}.
applicant_rejected.outcome=After review, we are unable to approve your application at this time.
applicant_rejected.reason=<strong>Reason:</strong> {{reason}}
applicant_rejected.appeal=If you believe this was a mistake, reply to this email with additional context and our team will take a second look.

# ── Coordinator invite (owner invited someone to register) ──────────────
coordinator_invite.subject={{orgName}} invited you to join {{brandShort}} as a coordinator
coordinator_invite.heading=You're invited to join {{orgName}}.
coordinator_invite.greeting=Hi {{recipientName}},
coordinator_invite.greeting_anonymous=Hello,
coordinator_invite.intro={{greeting}} <strong>{{orgName}}</strong> ({{inviterEmail}}) has invited you to register as a coordinator on {{brandLong}}.
coordinator_invite.role=As a coordinator you'll help {{orgName}} register and support participants on {{brandShort}}.
coordinator_invite.cta=Register as a coordinator
coordinator_invite.expiry=This invite is personal to this email address and expires on <strong>{{expiresOn}}</strong>. Register with the email address this message was sent to.
coordinator_invite.next=After you register, {{orgName}} reviews your request and you'll get a confirmation email.
coordinator_invite.footnote=Didn't expect this? You can ignore this email — no account is created until you register.

# ── Org owner approved ──────────────────────────────────────────────────
# Two tails: with the invite grant link, and before the invite subsystem is
# reachable for this deployment.
org_owner_approved.subject={{brandShort}}: {{orgName}} is approved
org_owner_approved.heading={{orgName}} is approved.
org_owner_approved.intro=Your organisation is now live on {{brandLong}} (registered with <strong>{{ownerEmail}}</strong>).
org_owner_approved.invite_lead=Coordinators can only join <strong>{{orgName}}</strong> when you invite them. Invite them by email below — each person gets their own one-time invite.
org_owner_approved.cta=Invite your coordinators
org_owner_approved.invite_note=You don't need an account and you can't sign in — you manage your coordinators entirely from the button above. Keep this email so you can find it again; the link works for 90 days. If it ever stops working, just open it and send again — we'll email you a fresh link automatically.
org_owner_approved.invite_pending=Coordinators join only when you invite them. You'll be able to invite them by email shortly — we'll send you the invite link in a follow-up message.

# ── Owner grant refreshed (previous invite link had expired) ────────────
owner_grant_refreshed.subject=Your new invite link for {{orgName}}
owner_grant_refreshed.heading=Here's your new invite link.
owner_grant_refreshed.intro=You asked for a fresh link to invite coordinators for <strong>{{orgName}}</strong> on {{brandLong}}. Your previous link had expired — this one replaces it and works for the next 90 days.
owner_grant_refreshed.cta=Open your invite page
owner_grant_refreshed.note=You don't need to sign in — you manage your coordinators entirely from this link. Keep this email so you can find it again; if it ever stops working, just open it and send again and we'll email you a fresh one automatically.
owner_grant_refreshed.footnote=Didn't request this? You can safely ignore this email — the link only works for your organisation.

# ── Org already registered (re-registration of a live org) ──────────────
org_already_registered.subject={{orgName}} is already registered
org_already_registered.heading=Your organisation is already registered.
org_already_registered.intro=Someone just tried to register <strong>{{orgName}}</strong> on {{brandLong}}. It is already approved and live, so there is nothing more to do — you do not need to register again.
org_already_registered.reason=If that was you because you were looking for your coordinator invitation link, here it is.
org_already_registered.cta=Invite coordinators
org_already_registered.note=You do not need to sign in — you invite and manage your coordinators entirely from this link. Keep this email so you can find it again.
org_already_registered.footnote=Didn't try to register? You can safely ignore this email — nothing changed, and the link only works for your organisation.
