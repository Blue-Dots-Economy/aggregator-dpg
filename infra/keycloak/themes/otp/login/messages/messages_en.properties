# Error page — escape hatch for the portal entitlement gate. The realm is
# shared by both DPGs, so a visitor refused here is often signed in with the
# other app's account and has no way to say so.
errorTitle=Something went wrong
doSignOutAndSwitch=Sign out and use another account
# Keycloak messages shown on the error page, reworded for the visitor. No
# apostrophes: these go through MessageFormat, where a single quote is an escape.
differentUserAuthenticated=You are already signed in as {0} in this browser. To use a different account, sign out first.
failedLogout=We could not finish signing you out because this page has expired. Sign out again to continue.

# Portal entitlement-gate denials (apply-portal-gate.py passes these as
# denyErrorMessage). Worded for the person reading them, who knows nothing
# about realms, sessions or "coordinators" as a role name.
# portalDenyNotCoordinator is the pre-Phase-5 gate's key (a realm whose gate
# was not rebuilt yet); an organisation owner can land on it too.
portalDenyNotCoordinator=This account can't be used to sign in here. If you have an Aggregator portal account, sign out and sign in with that one. If you manage an organisation, its sign-in may not be enabled yet — contact the network administrator.
portalDenyNotEntitled=This account can't be used to sign in here. If you have an Aggregator portal account, sign out and sign in with that one.
portalDenyNotApproved=Your Aggregator registration is still being reviewed. You'll be able to sign in once it is approved.
