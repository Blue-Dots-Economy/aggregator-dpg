parent=keycloak.v2

# Brand strings — overridden via Keycloak env vars at container start.
# Defaults match the generic Aggregator label so a misconfigured deploy
# still renders something readable instead of "blue dots" leaking.
brandShortName=${env.BRAND_SHORT_NAME:Aggregator}
brandLongName=${env.BRAND_LONG_NAME:Aggregator Portal}
brandSsoLabel=${env.BRAND_SSO_LABEL:SSO}

# Which app the visitor is signing in to, rendered as a pill beside the logo.
# `loginTheme` is realm-level and the realm is shared by both DPGs, so without
# this the signals and aggregator login pages are indistinguishable. The child
# `signals` theme overrides it — see themes/signals/login/theme.properties.
brandAppLabel=${env.BRAND_APP_LABEL:Aggregator Portal}

# Logo asset slugs — resolved at request time as
# `${url.resourcesPath}/img/brand/<slug>/logo*.png`. Slug must match the
# directory placed under `resources/img/brand/`.
brandLogoSlug=${env.BRAND_LOGO_SLUG:blue-dot}
# Hero-panel lockup. Filename inside img/brand/<brandLogoSlug>/ — set it to
# render the brand's own artwork on the blue panel instead of the wordmark +
# strapline text. Opt-in on purpose: onetac and orange-dot ship no
# logo-on-brand.png, and an unconditional <img> would break their login page.
# Use the on-brand (white-text) variant — the panel is dark.
heroLogo=${env.BRAND_HERO_LOGO:}
# Strapline under the hero wordmark. Blank it when the lockup artwork already
# carries the strapline, so it is not stated twice with different wording.
brandSeededBy=${env.BRAND_SEEDED_BY:Seeded by EkStep Foundation}
heroTitleLead=${env.HERO_TITLE_LEAD:Welcome to}
heroTitleHighlight=${env.HERO_TITLE_HIGHLIGHT:the Aggregator}
heroTitleTail=${env.HERO_TITLE_TAIL:portal.}
heroSubtitle=${env.HERO_SUBTITLE:Sign in to manage participants, registrations, and onboarding for your network.}

# Palette overrides — read by template.ftl's inline <style> block so the
# static blue-dots.css can stay generic. Defaults render the original
# indigo palette; per-network keycloak.env overrides every value.
# Typography (mirrors brand.json.typography). Quote-wrap families with
# spaces. Defaults preserve the prior Plus Jakarta + Inter pairing.
brandFontSans=${env.BRAND_FONT_SANS:'Inter', system-ui, sans-serif}
brandFontHeading=${env.BRAND_FONT_HEADING:'Plus Jakarta Sans', system-ui, sans-serif}
brandFontBody=${env.BRAND_FONT_BODY:'Inter', system-ui, sans-serif}

brandPrimary=${env.BRAND_PRIMARY_COLOR:#4f46e5}
brandPrimaryDark=${env.BRAND_PRIMARY_DARK:#4338ca}
brandPrimary500=${env.BRAND_PRIMARY_500:#6366f1}
brandPrimary100=${env.BRAND_PRIMARY_100:#e0e7ff}
brandPrimary50=${env.BRAND_PRIMARY_50:#eef2ff}
