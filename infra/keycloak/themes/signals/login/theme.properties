# Login theme for the `signals-ui` client.
#
# Why this exists: since the Phase B realm merge, both DPGs' clients live in one
# `bluedots` realm, and Keycloak's `loginTheme` is a REALM-level setting — so
# both apps rendered the identical page and signals visitors were shown the
# aggregator's title and hero copy. Keycloak's per-client `login_theme`
# attribute is the override; realms/realm.json points `signals-ui` here.
#
# This is a thin child of `otp`: every template, stylesheet, script and brand
# image is inherited through the theme parent chain, so nothing is duplicated.
# The OTP flow itself is realm-level and untouched — only theme resolution
# differs between the two clients.
parent=otp

# IMPORTANT: theme properties inherit, so every brand key the parent defines
# must be re-declared here. A key left out silently falls through to
# aggregator's value and shows the wrong brand on the signals login page.
#
# Defaults are signals' real values (not placeholders) so this theme renders
# correctly with no env plumbing at all. The SIGNALS_* vars exist only as
# optional per-network overrides, mirroring the parent's BRAND_*/HERO_* set.
brandShortName=${env.SIGNALS_BRAND_SHORT_NAME:Blue Dots}
brandLongName=${env.SIGNALS_BRAND_LONG_NAME:Blue Dots Signals}
brandAppLabel=${env.SIGNALS_BRAND_APP_LABEL:Signals Network}
brandSsoLabel=${env.SIGNALS_BRAND_SSO_LABEL:SSO}

# Slug must match a directory under the inherited
# `otp/login/resources/img/brand/`.
brandLogoSlug=${env.SIGNALS_BRAND_LOGO_SLUG:blue-dot}

heroTitleLead=${env.SIGNALS_HERO_TITLE_LEAD:Welcome to}
heroTitleHighlight=${env.SIGNALS_HERO_TITLE_HIGHLIGHT:the Signals network}
heroTitleTail=${env.SIGNALS_HERO_TITLE_TAIL:}
heroSubtitle=${env.SIGNALS_HERO_SUBTITLE:Sign in to discover and connect across the network.}

# Typography — Blue Dots brand guidelines specify Arial.
brandFontSans=${env.SIGNALS_BRAND_FONT_SANS:Arial, system-ui, sans-serif}
brandFontHeading=${env.SIGNALS_BRAND_FONT_HEADING:Arial, system-ui, sans-serif}
brandFontBody=${env.SIGNALS_BRAND_FONT_BODY:Arial, system-ui, sans-serif}

# Canonical Blue Dots palette. Kept distinct from the parent's indigo so the
# two login pages differ in accent as well as wording.
brandPrimary=${env.SIGNALS_BRAND_PRIMARY_COLOR:#0074ff}
brandPrimaryDark=${env.SIGNALS_BRAND_PRIMARY_DARK:#005ecc}
brandPrimary500=${env.SIGNALS_BRAND_PRIMARY_500:#57abff}
brandPrimary100=${env.SIGNALS_BRAND_PRIMARY_100:#cfe6ff}
brandPrimary50=${env.SIGNALS_BRAND_PRIMARY_50:#e6f0ff}
