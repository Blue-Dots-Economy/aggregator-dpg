# ════════════════════════════════════════════════════════════════════════════
# aggregator.config.yaml — single source of truth per deployment
#
# Copy this file to `config/aggregator.config.yaml`, edit the values, and
# the api/worker pick it up on next boot. No code changes per network;
# the same docker image runs blue_dot, purple_dot, yellow_dot, or any
# other signalstack network just by swapping this file + the relevant
# signalstack creds in .env.
# ════════════════════════════════════════════════════════════════════════════

aggregator:
  # Display + audit identity for the org running this deployment.
  name: BBMP
  legal_name: Bruhat Bengaluru Mahanagara Palike
  contact_email: ops@bbmp.gov.in

  # ── Signalstack network binding ────────────────────────────────────────────
  # The aggregator fetches the upstream `network.json` from this URL at
  # boot. It declares the domains (seeker / provider / …) and the JSON
  # Schemas the participant forms + bulk CSV are validated against.
  #
  # ALWAYS pin to a tag or commit SHA in production; never `refs/heads/...`.
  network:
    source: https://raw.githubusercontent.com/Blue-Dots-Economy/Signals-DPG/refs/heads/develop/examples/schemas/blue_dot/network.json

    # CSV cell delimiter for schema fields typed as `array`. Purple_dot
    # has multi-value fields (`disability_type`, `looking_for`,
    # `documents_available`) — operators upload `"Blindness|Low Vision"`.
    # Pipe is safe for India-data CSVs where commas are common in names.
    csv_array_delimiter: '|'

    # Optional — override the heuristic sniffer when a schema's field
    # naming resists detection. The sniffer covers blue_dot + purple_dot
    # + yellow_dot out of the box; only fill this in if a domain's
    # identity selectors come out wrong.
    #
    # field_overrides:
    #   seeker:
    #     name: beneficiary_name
    #     phone: mobile_number
    #     email: email
    #   provider:
    #     name: contact_name
    #     phone: contact_phone
    #     email: contact_email

  # ── Brand / UI ─────────────────────────────────────────────────────────────
  # Sidebar, topbar, email templates, and the participant portal URL
  # slug all read from these values. Restart the api+web to apply.
  brand:
    short_name: Blue Dots
    long_name: Blue Dots Aggregator Portal
    tagline: Track every participant in your network — at a glance.
    url_slug: blue-dots
    primary_color: '#2563EB'
    accent_color: '#3B82F6'
    # logo_url: https://cdn.example.com/blue-dots-logo.svg
    # favicon_url: https://cdn.example.com/favicon-blue.ico

  # ── Domain labels (optional UI overrides) ──────────────────────────────────
  # Defaults: derived from the domain id in network.json. Override here
  # to surface friendlier names in the dashboard tabs + sidebar.
  domain_labels:
    seeker:
      singular: Seeker
      plural: Seekers
      tab_label: Seekers
    provider:
      singular: Provider
      plural: Providers
      tab_label: Providers

  # ── Onboarding behaviour ───────────────────────────────────────────────────
  onboarding:
    # Bulk-upload only. When true, an adult bulk row is pushed to Signals with
    # user_terms / user_privacy / profile_creation asserted on the participant's
    # behalf (aggregator-level consent acting as participant-level consent),
    # which satisfies the consent_required go-live gate and publishes the
    # profile immediately. Defaults to false: rows then stay `draft` until the
    # participant accepts for themselves. Minors are never presumed either way.
    # The interactive registration-link flow always captures real consent.
    presume_consent: false
    bulk_max_rows: 10000

  # ── Registration modes ─────────────────────────────────────────────────────
  # Per-link capture channels offered on the forms/QR page. The admin dropdown
  # is rendered straight from these keys, so adding a channel needs no code
  # change — and removing one stops it being offered on this deployment.
  #
  #   submission_shape      account_and_profile = identity + full profile form
  #                         account_only        = identity capture only
  #   public_hint_i18n_key  optional copy shown under the public form
  #   signals_cta           whether this mode offers the Signals UI hand-off
  #                         (the "Already Registered — Sign In" link and the
  #                         post-submit redirect). Optional; defaults to
  #                         `submission_shape == account_and_profile`.
  #
  # The hand-off also needs the SIGNALS_UI_URLS env var, which maps each domain
  # to its Signals UI login URL. Use the Signals UI page (normally
  # <origin>/auth/login) — NOT a Keycloak authorization URL, which embeds
  # one-time state/PKCE values and fails for every user.
  registration_modes:
    voice:
      label_i18n_key: registration_mode.voice.label
      submission_shape: account_only
      public_hint_i18n_key: registration_mode.voice.hint
      signals_cta: false
    form:
      label_i18n_key: registration_mode.form.label
      submission_shape: account_and_profile
      public_hint_i18n_key: null
      signals_cta: true

  # ── Admin email recipients (registration approval notifications) ───────────
  admin_emails:
    - admin@bbmp.gov.in
