# Built-in roles (docs/rbac/rbac-permissions-and-roles.md §3).
#
# Applied to the database at every API start with RBAC on: a built-in role is
# defined here and nowhere else, so edits here take effect on the next start
# and edits to built-in roles in the database are overwritten. Custom roles
# live only in the database. A network or brand ships its own file in
# config/<network>/ or config/<network>/<brand>/ (the most specific file wins;
# no merging).
#
# Permissions are fixed in code (packages/rbac/src/interface.ts); this file
# groups them. Base roles (base_for) follow membership and are never assigned
# by hand; additional roles are assigned by a holder of assigned_by.

version: 2

roles:
  network_admin:
    name: Network Admin
    description: The root organisation's owner; administers the network.
    account_type: admin
    base_for: root_owner
    assignable_org_types: [network_facilitator]
    permissions:
      - profiles.view
      - profiles.export
      - profiles.onboard
      - profiles.verify
      - profiles.retire
      - profiles.move
      - campaigns.run
      - orgs.onboard
      - orgs.block
      - contact.unmask
      - agreement.manage
      - network.administer

  org_admin:
    name: Org Admin
    description: An aggregator organisation's owner.
    account_type: admin
    base_for: org_owner
    assignable_org_types: [aggregator]
    permissions:
      - profiles.view
      - profiles.export
      - profiles.onboard
      - profiles.retire
      - campaigns.run
      - org.manage
      - contact.unmask

  coordinator:
    name: Coordinator
    description: An approved coordinator of an aggregator organisation.
    account_type: coordinator
    base_for: org_member
    assignable_org_types: [aggregator]
    permissions:
      - profiles.view
      - profiles.onboard
      - campaigns.run

  org_onboarder:
    name: Org Onboarder
    description: Onboards other organisations (Super Aggregator).
    account_type: admin
    assignable_org_types: [aggregator]
    assigned_by: network.administer
    permissions:
      - profiles.verify
      - profiles.move
      - orgs.onboard

  pii_access:
    name: PII Access
    description: Sees and exports decrypted profile details.
    account_type: coordinator
    assignable_org_types: [aggregator]
    assigned_by: org.manage
    max_days: 90
    permissions:
      - profiles.view_pii

  data_export:
    name: Data Export
    description: Downloads masked profile lists.
    account_type: coordinator
    assignable_org_types: [aggregator]
    assigned_by: org.manage
    permissions:
      - profiles.export
