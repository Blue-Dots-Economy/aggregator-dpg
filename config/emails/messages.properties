# Aggregator-level DEFAULT email copy — the COMPLETE key list.
#
# Every key a case declares must exist here; a hole is a deployment defect and
# `assertMessagesComplete()` fails at boot rather than letting a blank email
# ship. Override layers may be partial and list only what they change.
#
# Precedence, lowest first:
#   1. config/emails/messages.properties            ← this file (complete)
#   2. config/<network>/emails/messages.properties
#   3. config/<network>/<brand>/emails/messages.properties
#   4. EMAIL_MESSAGES_PATH (per-instance escape hatch, wins over everything)
#
# Format: `key=value`, one per line, split at the first `=`. `#` and `!` start
# a comment. No escapes, no line continuation, so every value is single-line —
# which is why a value may itself contain `=` (a link's query string).
#
# Values are HTML fragments limited to <b> <strong> <i> <em> <a> <br>. Block
# styling (paragraph, heading, callout, button) is owned by the code — do not
# put style attributes here. The plain-text part of every email is DERIVED
# from these same values, so copy cannot drift between the two.
#
# Placeholders are {{likeThis}}. Each case declares its tokens and their type
# in apps/api/src/services/email-templates/email-cases.ts; a `text` token is
# escaped on substitution, an `html` token is inserted raw and may only be
# built in code. An unprovided token renders as literal {{text}} rather than
# disappearing, and an unknown key in an override layer is logged and skipped.
#
# {{brandShort}} and {{brandLong}} are available to every case and come from
# the deployment's resolved network/brand config.

# ── Coordinator invite (owner invited someone to register) ──────────────
coordinator_invite.subject={{orgName}} invited you to join {{brandShort}} as a user
coordinator_invite.heading=You're invited to join {{orgName}}.
coordinator_invite.greeting=Hi {{recipientName}},
coordinator_invite.greeting_anonymous=Hello,
coordinator_invite.intro={{greeting}} <strong>{{orgName}}</strong> ({{inviterEmail}}) has invited you to register as a user on {{brandLong}}.
coordinator_invite.role=As a user you'll help {{orgName}} register and support participants on {{brandShort}}.
coordinator_invite.cta=Register as a user
coordinator_invite.expiry=This invite is personal to this email address and expires on <strong>{{expiresOn}}</strong>. Register with the email address this message was sent to.
coordinator_invite.next=After you register, we send a one-time code to this email address. Enter it to verify the address and sign in; no further approval is needed.
coordinator_invite.footnote=Didn't expect this? You can ignore this email — no account is created until you register.

org_invite.subject={{orgName}} invited you to register your organisation on {{brandShort}}
org_invite.heading=Register your organisation under {{orgName}}.
org_invite.greeting=Hi {{recipientName}},
org_invite.greeting_anonymous=Hello,
org_invite.intro={{greeting}} <strong>{{orgName}}</strong> ({{inviterEmail}}) has invited you to register your organisation on {{brandLong}}.
org_invite.role=Your organisation will sit under {{orgName}}. You can invite your own team and other organisations once you are in.
org_invite.cta=Register your organisation
org_invite.expiry=This invite is personal to this email address and expires on <strong>{{expiresOn}}</strong>. Register with the email address this message was sent to.
org_invite.next=After you register, we send a one-time code to this email address. Enter it to verify the address and sign in; no further approval is needed.
org_invite.footnote=Didn't expect this? You can ignore this email. No account is created until you register.

coordinator_joined.subject={{joinerName}} has joined {{orgName}} on {{brandShort}}
coordinator_joined.heading={{joinerName}} has joined {{orgName}}.
coordinator_joined.intro={{joinerName}} ({{joinerEmail}}) accepted your invitation and verified their email. They can now sign in and onboard seekers and providers for <strong>{{orgName}}</strong>.
coordinator_joined.cta=Open your team

org_joined.subject={{orgName}} has joined {{brandShort}}
org_joined.heading={{orgName}} has joined under {{parentName}}.
org_joined.intro=<strong>{{orgName}}</strong> ({{ownerEmail}}) accepted your invitation and verified its email. It is now an active organisation under {{parentName}}.
org_joined.cta=Open your organisations

# ── Invite to an address that already has an account (Phase 5, C9) ─────
invite_existing_account.subject=You were invited to {{orgName}}
invite_existing_account.heading=You already have an account.
invite_existing_account.intro=<strong>{{orgName}}</strong> invited this address to join {{brandLong}} as a user, but it already belongs to an account here, so there is nothing to register.
invite_existing_account.cta=Sign in
invite_existing_account.note=Sign in with this email address; we'll send you a one-time code. If you meant to join {{orgName}} instead, reply to the person who invited you.
invite_existing_account.footnote=Didn't expect this? You can safely ignore this email — nothing changed.

# ── Owner notice: the network admin acted in their org (Phase 5, C13) ──
org_admin_action.subject={{brandShort}}: a change to {{orgName}}
org_admin_action.heading=The network administrator made a change.
org_admin_action.intro=The {{brandLong}} network administrator made this change to <strong>{{orgName}}</strong>: {{action}}.
org_admin_action.cta=Review in the console
org_admin_action.footnote=You receive this because you manage {{orgName}}. No action is needed if the change was expected.

# ── Owner notice: the parent org's owner changed the org's "known as" value ──
org_known_as.subject={{brandShort}}: a change to {{orgName}}
org_known_as.heading=The owner of {{parentName}} made a change.
org_known_as.intro=The owner of <strong>{{parentName}}</strong> changed what <strong>{{orgName}}</strong> is known as.
org_known_as.cta=Review in the console
org_known_as.footnote=You receive this because you manage {{orgName}}. No action is needed if the change was expected.
