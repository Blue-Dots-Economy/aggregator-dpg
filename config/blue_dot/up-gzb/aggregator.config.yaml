# Aggregator config for the UP-GZB instance of blue_dot. Points at the up-gzb
# network.json (3 domains, incl. service_provider) and at the up-gzb
# registration-schema override in schemas/aggregator/;
# swap `network.source` to deploy against another signalstack network.
# Treat this file as deploy state; the .example.yaml sibling documents
# every supported field.

aggregator:
  name: Blue Dots Aggregator
  contact_email: ops@bluedots.local

  network:
    source: https://raw.githubusercontent.com/Blue-Dots-Economy/bluedots-schemas/refs/heads/main/blue_dot/up-gzb/network.json
    # Participant registration-link consent (Terms/Privacy/profile-creation),
    # fetched the same cache-backed way as network.json (sibling in the schemas
    # repo). Env AGGREGATOR_PARTICIPANT_CONSENT_SOURCE overrides; absent ⇒ web app uses the
    # on-disk schemas/participant/consent.json copy.
    consent_source: https://raw.githubusercontent.com/Blue-Dots-Economy/bluedots-schemas/refs/heads/main/blue_dot/up-gzb/consent.json
    csv_array_delimiter: '|'
    field_overrides:
      seeker:
        name: name
        phone: phone
        email: email
      provider:
        name: jobProviderName
        phone: hiringManagerPhoneNumber
        email: hiringManagerEmail
      # `name` is the CONTACT PERSON, not organisationName: these selectors feed
      # dedup / Keycloak linking / the signals user payload, i.e. the human who
      # logs in. organisationName is optional in the schema while
      # contactPersonName is required, so organisationName risks an empty name.
      service_provider:
        name: contactPersonName
        phone: contactPhoneNumber
        email: contactEmail

  brand:
    short_name: Blue Dots
    long_name: Blue Dots Aggregator Portal
    tagline: Track every participant in your network — at a glance.
    url_slug: blue-dots
    # Canonical hex from Blue Dots Brand Guidelines (see brand.json).
    primary_color: '#0074ff'
    accent_color: '#57abff'

  domain_labels:
    seeker:
      singular: Seeker
      plural: Seekers
      tab_label: Seekers
    provider:
      singular: Provider
      plural: Providers
      tab_label: Providers
    service_provider:
      singular: Service Provider
      plural: Service Providers
      tab_label: Service Providers

  onboarding:
    # Bulk-upload only: when true, an adult bulk row is pushed to Signals with
    # user_terms / user_privacy / profile_creation asserted on the participant's
    # behalf, satisfying the consent_required go-live gate and publishing the
    # profile immediately. false => compliance omitted, rows stay draft until the
    # participant accepts. Minors are never presumed either way. The interactive
    # registration-link flow always captures real consent.
    presume_consent: false
    bulk_max_rows: 10000

  # Per-link registration modes. Each key names an admin-facing channel.
  # `submission_shape` decides what the public form renders:
  #   - account_only        : MinimalIdentityForm (name + phone OR email + consent).
  #   - account_and_profile : full RJSF profile schema; partial submissions accepted.
  # `public_hint_i18n_key` is the i18n key rendered beneath the form;
  # null means no hint.
  registration_modes:
    voice:
      label_i18n_key: registration_mode.voice.label
      submission_shape: account_only
      public_hint_i18n_key: registration_mode.voice.hint
    form:
      label_i18n_key: registration_mode.form.label
      submission_shape: account_and_profile
      public_hint_i18n_key: null

  admin_emails:
    - abhishekg@sanketika.in
