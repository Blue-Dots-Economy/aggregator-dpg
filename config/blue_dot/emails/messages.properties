# Blue Dot email copy overrides — PARTIAL. Only the keys listed here are
# changed; everything else falls through to the aggregator-level default at
# config/emails/messages.properties, which holds the full key list and
# documents the layering.
#
# Precedence: config/emails < this file < config/blue_dot/<brand>/emails
# < EMAIL_MESSAGES_PATH.
#
# Values are HTML fragments limited to <b> <strong> <i> <em> <a> <br>. Block
# styling is owned by the code — no style attributes here. The plain-text part
# is derived from these values, so there is nothing to keep in sync.
#
# Placeholders are {{likeThis}} and are declared per case in email-cases.ts.
# An unknown key is logged and skipped at boot rather than applied, so a typo
# does not silently look like a landed edit.

# This file intentionally ships no overrides: Blue Dot uses the bundled copy.
# It exists as the documented seam for a network to reword its own mail without
# a code change. Uncomment and edit to override, e.g.:
#
# coordinator_invite.subject={{orgName}} invited you to join Blue Dot
